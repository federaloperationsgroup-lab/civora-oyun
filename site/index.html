  </div>
</div>
<script>
  // Açılış yazısı ve sayfanın dili oyun yüklenmeden önce seçili dilde (00_dil.js ile aynı kural: bu cihazda seçilen dil, yoksa tarayıcının dili)
  (function () {
    var s = null;
    try { s = localStorage.getItem("civora.dil"); } catch (e) { /* depolama yok */ }
    var t = String((navigator.languages && navigator.languages[0]) || navigator.language || "tr").toLowerCase();
    var en = s === "en" || (s !== "tr" && t.indexOf("tr") !== 0);
    if (en) { document.documentElement.lang = "en"; document.getElementById("baslangic-yazi").textContent = "Loading Civora…"; }
  })();
</script>
