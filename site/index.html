<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civora</title>
<meta name="description" content="Civora: gerçek dünya haritasında, ülkeleri oyuncuların yönettiği strateji oyunu.">
<meta name="theme-color" content="#0F362F">
<link rel="icon" href="img/amblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="stil.css?v=2026-10-19-5732286f-6370c72">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="uygulama" aria-live="polite">
  <div class="baslangic" id="baslangic">
    <img src="img/amblem.png" alt="" width="72" height="72">
    <p id="baslangic-yazi">Civora açılıyor…</p>
  </div>
</div>
<script>
  // Açılış yazısı ve sayfanın dili oyun yüklenmeden önce seçili dilde (00_dil.js ile aynı kural: bu cihazda seçilen dil, yoksa tarayıcının dili)
  (function () {
    var s = null;
    try { s = localStorage.getItem("civora.dil"); } catch (e) { /* depolama yok */ }
    var t = String((navigator.languages && navigator.languages[0]) || navigator.language || "tr").toLowerCase();
    var en = s === "en" || (s !== "tr" && t.indexOf("tr") !== 0);
    if (en) { document.documentElement.lang = "en"; document.getElementById("baslangic-yazi").textContent = "Loading Civora…"; }
  })();
</script>
<div class="tostlar" id="tostlar" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Civora'yı oynamak için tarayıcında JavaScript açık olmalı. · <span lang="en">To play Civora, JavaScript must be enabled in your browser.</span></p></noscript>
<script type="module" src="app.js?v=2026-10-19-5732286f-6370c72"></script>
</body>
</html>
