<div id="uygulama" aria-live="polite">
  <div class="baslangic" id="baslangic">
    <img src="img/amblem.png" alt="" width="72" height="72">
    <p id="baslangic-yazi">Civora açılıyor…</p>

<script>
  // Yeni oyuncu yalnız açılışı indirir. Kalan katalog ve oyun oturum açılınca Parcalar tarafından sırayla yüklenir.
  // Dönen oyuncu için büyük dosyalar paralel ön yüklenir; çalıştırma sırası yine katalog → app.js olur.
  (function () {
    var s = null, oturumlu = false;
    try {
      s = localStorage.getItem("civora.dil");
      var o = JSON.parse(localStorage.getItem("civora.oturum") || "null");
      oturumlu = !!o && typeof o === "object" && typeof o.access_token === "string" && !!o.access_token;
      if (o !== null && !oturumlu) localStorage.removeItem("civora.oturum");
    } catch (e) { /* depolama kapalı veya oturum bozuk: yalnız açılış */ }
    var t = String((navigator.languages && navigator.languages[0]) || navigator.language || "tr").toLowerCase();
    var en = s === "en" || (s !== "tr" && t.indexOf("tr") !== 0);
    if (en) { document.documentElement.lang = "en"; document.getElementById("baslangic-yazi").textContent = "Loading Civora…"; }
    if (oturumlu) {
      var onYukle = en ? ["veri/en.js", "app.js"] : ["app.js"];
      for (var j = 0; j < onYukle.length; j++) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "script"; l.href = onYukle[j] + "?v=2026-11-09-22f8ad98-68be21e";
        document.head.appendChild(l);
      }
    }
    var parcalar = en ? [["veri/en_acilis.js", "en_acilis"], ["acilis.js", "acilis"]]
                      : [["acilis.js", "acilis"]];
    for (var i = 0; i < parcalar.length; i++) {
      var b = document.createElement("script");
      b.src = parcalar[i][0] + "?v=2026-11-09-22f8ad98-68be21e";
      b.async = false;
      b.setAttribute("data-parca", parcalar[i][1]);
      b.onerror = function () { this.setAttribute("data-parca-durum", "hata"); };
      document.head.appendChild(b);
    }
  })();
</script>
