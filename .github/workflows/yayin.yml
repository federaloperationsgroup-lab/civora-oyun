# Civora oyun sitesi (T-27). Bu depo yalnız derlenmiş oyun ekranlarını taşır; kaynak kod ana (gizli) depodadır.
# Her gönderimde: Supabase ayar dosyası depo değişkenlerinden yazılır (yapilandirma.mjs; Cloudflare Pages da aynı betiği
# çalıştırır, D-098), site GitHub Pages'e yayımlanır.
# Gereken depo değişkenleri (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL      Supabase → Project Settings → Data API → Project URL (https://….supabase.co)
#   SUPABASE_ANAHTAR  Supabase → Project Settings → API Keys → Publishable key (herkese açık anahtar; gizli anahtar DEĞİL)
# İsteğe bağlı:
#   SITE_ADRESI       sitenin asıl adresi (ör. https://civora.com); yoksa GitHub Pages adresi kullanılır. Bağlantı
#                     paylaşılınca görünen kartın resmi ve adresi bununla yazılır.
name: Yayın

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayin:
    name: Siteyi yayımla
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - id: pages
        uses: actions/configure-pages@v5
      - name: Supabase ayar dosyası ve paylaşım kartı
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANAHTAR: ${{ vars.SUPABASE_ANAHTAR }}
          SITE_ADRESI: ${{ vars.SITE_ADRESI || steps.pages.outputs.base_url }}
        run: node yapilandirma.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dagitim
        uses: actions/deploy-pages@v4
